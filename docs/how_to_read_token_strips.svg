<rect x="16" y="325" width="14" height="14" fill="#3ad038"/><rect x="32" y="325" width="14" height="14" fill="#3ad038"/><text x="54" y="336" fill="#333"><tspan font-weight="600">Same color = same id</tspan>, in every row and every figure of one model. The number on a band is the id.</text>
<rect x="16" y="349" width="30" height="14" fill="#e183d6"/><text x="54" y="360" fill="#333"><tspan font-weight="600">Id 3</tspan> is what PINT outputs for silence (leading and trailing pause).</text>
<text x="16" y="386" fill="#333"><tspan font-weight="600">Rows of one figure say the same words</tspan>: the more their colors match, the less the ids depend on who speaks or how it was recorded.</text>
