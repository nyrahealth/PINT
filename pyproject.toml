[project]
name = "pint-infer"
version = "0.1.0"
description = "PINT speech tokenizer inference: audio in, frame features or token ids out"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "transformers>=4.50,<5",
    "huggingface_hub>=0.30",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.scripts]
pint-infer = "pint_infer.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pint_infer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/pint_infer"]
# torchaudio ships no stubs; torch, numpy and transformers are checked for real.
[[tool.mypy.overrides]]
module = ["torchaudio.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
